  <path d="M256 214 L256 470" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="24 26" opacity="0.42"/>

  <circle cx="256" cy="188" r="74" fill="#fbbf24" opacity="0.16" filter="url(#soft)"/>

