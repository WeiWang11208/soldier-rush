# 小兵冲冲冲 · game.20020103.xyz
# 安装位置：personal-agent-server:/etc/nginx/conf.d/soldier-rush.conf
# 源站运行在这台 Debian 主机上，通过反向 SSH 隧道暴露为 127.0.0.1:3473。
# 注意：不要删除 /opt/soldier-rush（旧静态发布）——保留作回滚，但不再作为源站。

server {
    listen 80;
    listen [::]:80;
    server_name game.20020103.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.20020103.xyz;

    ssl_certificate     /etc/letsencrypt/live/20020103.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/20020103.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3473;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
        limit_except GET HEAD { deny all; }
    }

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    access_log /var/log/nginx/soldier-rush.access.log;
    error_log  /var/log/nginx/soldier-rush.error.log;
}
